name: Build SocAPI Postiz image

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Versiunea Postiz, ex: v2.23.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/upstream-${{ inputs.upstream_tag }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: |
            ghcr.io/socapi-app/postiz:${{ inputs.upstream_tag }}-socapi
            ghcr.io/socapi-app/postiz:latest

      - name: Notify Telegram - build success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          MESSAGE=$(cat <<EOF
          ✅ Imaginea SocAPI pentru Postiz ${UPSTREAM_TAG} a fost construită și publicată cu succes.

          Imagine:
          ghcr.io/socapi-app/postiz:${UPSTREAM_TAG}-socapi
          EOF
          )

          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Notify Telegram - build failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          curl -fsS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Build-ul imaginii SocAPI pentru Postiz ${UPSTREAM_TAG} a eșuat."
